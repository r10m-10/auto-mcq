<!doctype html>
<html lang="en" data-theme="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fastest Finger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.conditional.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main">
        <h1>FASTEST FINGER</h1>

        <div class="McqGrid">
            <button class="circle-btn" data-option="A">A</button>
            <button class="circle-btn" data-option="B">B</button>
            <button class="circle-btn" data-option="C">C</button>
            <button class="circle-btn" data-option="D">D</button>
        </div>
    </div>
    <hr>
    <div class="status">
        <h3>STATUS: <span class="cur-status">ACTIVE</span></h3>
        <div class="pico">
            <fieldset>
                <label>
                    <input type="checkbox" role="switch" checked/>
                </label>
            </fieldset>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
