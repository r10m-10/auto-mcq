<!doctype html>
<html lang="en" data-theme="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AutoMCQ</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.conditional.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <button id="extensionToggle" class="power-btn" aria-label="Toggle AutoMCQ" aria-pressed="true" title="Toggle AutoMCQ">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
            <path d="M12 3v8"/>
            <path d="M6.2 6.6a7.5 7.5 0 1 0 11.6 0"/>
        </svg>
    </button>
    <div class="popup-content" id="popupContent">
        <span class="credits-badge">Credits: <span class="credits-balance">—</span></span>
        <div class="main">
            <h1 class="heading">AUTO MCQ</h1>

            <div class="mode-selector-wrapper">
                <div class="mode-selector">
                    <button class="mode-btn active" data-mode="normal">Normal</button>
                    <button class="mode-btn" data-mode="fast">Fast</button>
                </div>
                <button class="info-btn" aria-label="Show mode details" aria-haspopup="dialog" aria-controls="infoOverlay" tabindex="0">
                    <span class="info-icon" aria-hidden="true">&#8505;</span>
                </button>
            </div>

            <div class="McqGrid">
                <button class="circle-btn" data-option="A">A</button>
                <button class="circle-btn" data-option="B">B</button>
                <button class="circle-btn" data-option="C">C</button>
                <button class="circle-btn" data-option="D">D</button>
            </div>
        </div>
    </div>

    <div class="toast-overlay" id="toastOverlay">
        <div class="toast" id="toast">
            <span class="toast-message" id="toastMessage"></span>
            <button class="toast-close" id="toastClose">&times;</button>
        </div>
    </div>

    <div class="info-overlay" id="infoOverlay" role="dialog" aria-modal="true" aria-label="Mode details">
        <div class="info-card">
            <p class="info-title">Mode details</p>
            <p class="info-line"><b>Normal</b> &mdash; 5s delay, costs 1 credit</p>
            <p class="info-line"><b>Fast</b> &mdash; instant click, costs 4 credits</p>
        </div>
    </div>

    <hr>
    <div class="status">
        <h3>STATUS: <span class="cur-status">ACTIVE</span></h3>
    </div>

    <button class="claim-btn" id="claimBtn">CLAIM CREDITS &rarr;</button>
    <script src="script.js"></script>
</body>

</html>
