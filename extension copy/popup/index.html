<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AutoMCQ</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.conditional.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <button id="extensionToggle" class="power-btn" aria-label="Toggle AutoMCQ" aria-pressed="true" title="Toggle AutoMCQ">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
            <path d="M12 3v8"/>
            <path d="M6.2 6.6a7.5 7.5 0 1 0 11.6 0"/>
        </svg>
    </button>
    <button id="menuBtn" class="menu-btn" aria-label="Open menu" aria-haspopup="true" aria-expanded="false" title="Menu">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
            <line x1="4" y1="6" x2="20" y2="6"/>
            <line x1="4" y1="12" x2="20" y2="12"/>
            <line x1="4" y1="18" x2="20" y2="18"/>
        </svg>
    </button>
    <nav class="menu" id="menu" aria-label="Options" aria-hidden="true">
        <div class="menu-row">
            <span class="menu-label">DARK MODE</span>
            <button class="theme-switch" id="themeSwitch" role="switch" aria-checked="false" aria-label="Toggle dark mode">
                <span class="theme-switch-knob">
                    <svg class="icon-sun" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.2 4.2l1.4 1.4m12.8 12.8 1.4 1.4M1 12h2m18 0h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" width="12" height="12" fill="currentColor" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                </span>
            </button>
        </div>
        <hr class="menu-divider">
        <button class="menu-item" id="copyIdBtn">COPY DEVICE ID</button>
        <button class="menu-item" id="ledgerBtn">VIEW CREDIT LEDGER</button>
        <button class="menu-item" id="privacyBtn">PRIVACY POLICY</button>
        <button class="menu-item" id="homeBtn">OPEN HOMEPAGE</button>
        <button class="menu-item menu-item--danger" id="resetIdBtn">RESET DEVICE ID</button>
        <p class="menu-version" id="menuVersion">AutoMCQ v&mdash;</p>
    </nav>
    <div class="popup-content" id="popupContent">
        <span class="credits-badge">Credits: <span class="credits-balance">—</span></span>
        <div class="main">
            <h1 class="heading">AUTO MCQ</h1>

            <div class="mode-selector-wrapper">
                <div class="mode-selector">
                    <button class="mode-btn active" data-mode="normal">Normal</button>
                    <button class="mode-btn" data-mode="fast">Fast</button>
                </div>
                <button class="info-btn" aria-label="Show mode details" aria-haspopup="dialog" aria-controls="infoOverlay" tabindex="0">
                    <span class="info-icon" aria-hidden="true">&#8505;</span>
                </button>
            </div>

            <div class="McqGrid">
                <button class="circle-btn" data-option="A">A</button>
                <button class="circle-btn" data-option="B">B</button>
                <button class="circle-btn" data-option="C">C</button>
                <button class="circle-btn" data-option="D">D</button>
            </div>
        </div>
    </div>

    <div class="toast-overlay" id="toastOverlay">
        <div class="toast" id="toast">
            <span class="toast-message" id="toastMessage"></span>
            <button class="toast-close" id="toastClose">&times;</button>
        </div>
    </div>

    <div class="info-overlay" id="infoOverlay" role="dialog" aria-modal="true" aria-label="Mode details">
        <div class="info-card">
            <p class="info-title">Mode details</p>
            <p class="info-line"><b>Normal</b> &mdash; 5s delay, costs 1 credit</p>
            <p class="info-line"><b>Fast</b> &mdash; instant click, costs 4 credits</p>
        </div>
    </div>

    <div class="reset-overlay" id="resetOverlay" role="dialog" aria-modal="true" aria-label="Reset device ID">
        <div class="reset-card">
            <p class="reset-title">Reset loses old credits</p>
            <p class="reset-line">Your current device ID and its credit balance will be permanently deleted.</p>
            <button class="reset-confirm" id="resetConfirmBtn">CONFIRM RESET</button>
            <button class="reset-cancel" id="resetCancelBtn">Cancel</button>
        </div>
    </div>

    <hr>
    <div class="status">
        <h3>STATUS: <span class="cur-status">ACTIVE</span></h3>
    </div>

    <button class="claim-btn" id="claimBtn">CLAIM CREDITS &rarr;</button>
    <script src="script.js"></script>
</body>

</html>
